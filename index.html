<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyInk — Documents</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="wordmark">StudyInk</div>

    <nav>
      <button class="nav-item active"><span class="icon">▣</span> Documents</button>
      <button class="nav-item"><span class="icon">☆</span> Favorites</button>
      <button class="nav-item"><span class="icon">♧</span> Shared</button>
      <button class="nav-item"><span class="icon">⌂</span> Marketplace <small>50+ templates</small></button>
      <div class="nav-divider"></div>
      <button class="nav-item"><span class="icon">⌫</span> Trash</button>
    </nav>

    <div class="sidebar-card">
      <button class="close-card">×</button>
      <div class="card-art">
        <div class="mini-page left"></div>
        <div class="mini-page right"></div>
      </div>
      <strong>StudyInk for Tablet</strong>
      <p>Get the full StudyInk experience on your tablet.</p>
      <button class="download-btn">Get the app</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div></div>
      <div class="top-actions">
        <button title="Search">⌕</button>
        <button title="Settings">⚙</button>
      </div>
    </header>

    <section class="content">
      <div class="title-row">
        <h1>Documents</h1>
        <div class="view-controls">
          <button class="view active">▦</button>
          <button class="view">☷</button>
        </div>
      </div>

      <div class="empty-state">
        <div class="empty-illustration">
          <div class="paper-sheet"></div>
          <div class="pencil">✎</div>
          <div class="spark one">✦</div>
          <div class="spark two">✧</div>
        </div>
        <h2>Ready to start learning?</h2>
        <p>Create a notebook, import your homework, or open a blank page.<br>
        StudyInk AI can help you solve, explain, research, and organize your work.</p>

        <div class="new-wrap">
          <button class="new-btn" id="newBtn">＋ New <span>⌄</span></button>
          <div class="new-menu" id="newMenu">
            <div class="menu-section">NOTEBOOK</div>
            <button data-create="notebook">▤ <span><b>Notebook</b><small>Handwritten notes and homework</small></span></button>
            <button data-create="document">▧ <span><b>Text document</b><small>Typed notes and essays</small></span><em>BETA</em></button>
            <button data-create="whiteboard">▦ <span><b>Whiteboard</b><small>Freeform canvas</small></span><em class="new">NEW</em></button>
            <button data-create="quick">✎ <span><b>Quick note</b><small>Start writing immediately</small></span></button>
            <button data-create="image">▧ <span><b>Image</b><small>Annotate a picture</small></span></button>
            <button data-create="folder">□ <span><b>Folder</b><small>Organize your study files</small></span></button>
            <div class="menu-divider"></div>
            <div class="menu-section">IMPORT</div>
            <button data-create="import">⇩ <span><b>Import file</b><small>PDF, image, or document</small></span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
